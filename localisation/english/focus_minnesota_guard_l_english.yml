	NCC_the_fight_for_the_state:0 "Anything For the Fight Against Communism"
	NCC_the_fight_for_the_state_desc:0 "We must be willing to let military takeover in order us to get rid of these communist scum. The Military may be an extreme action, but it is what must be done in these harsh times."
	NCC_the_northern_defence_command_center:0 "Northern Defence Command Center"
	NCC_the_northern_defence_command_center_desc:0 "We shall have a staging ground whilist we have lost St.Paul. Far enough to not be taken without a fight."

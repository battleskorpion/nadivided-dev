	NCC_one_final_push:0 "One Final Push"
	NCC_one_final_push_desc:0 "One Final Push"
	NCC_begin_reconstruction:0 "Begin Civil War Recovery"
	NCC_begin_reconstruction_desc:0 "We are beginning civil war recovery by rebuilding infrastructure, restoring order, and reviving the economy. Through reconstruction efforts and strict governance, we aim to heal divisions while ensuring lasting stability under our rule."
	NCC_the_military_takesover:0 "The National Guard Tightens its Grip"
	NCC_the_military_takesover_desc:0 "The State Affirms Control"
	NCC_force_bonds_buying:0 "Force Bonds Buying"
	NCC_force_bonds_buying_desc:0 "We are enforcing compulsory bond buying, requiring citizens and businesses to invest directly in the state. This measure secures steady funding for our regime while binding the people’s wealth and future to the success of our government."
	NCC_reform_society_hierarchy:0 "Reform The Social Hierarchy"
	NCC_reform_society_hierarchy_desc:0 "We are reforming the social hierarchy of the [NCC.GetAdjectiveCap], placing loyalty and service above class or wealth. Under this new order, authority flows from military discipline, ensuring that those most devoted to the state’s strength and stability hold power and influence."
	NCC_armament_production_junta:0 "Subsidize Military Industrialist"
	NCC_armament_production_junta_desc:0 ""
	NCC_loosen_recruitment_standards:0 "Loosen Recruitment Standards"
	NCC_loosen_recruitment_standards_desc:0 "Loosen Recruitment Standards"
	NCC_tighten_recruitment_standards:0 "Selective Service Training Act"
	NCC_tighten_recruitment_standards_desc:0 "Tighten Recruitment Standards"
	NCC_junta_intelligence:0 "NC Command Intelligence"
	NCC_junta_intelligence_desc:0 "The State Intelligence"
	NCC_the_loyal_army:0 "The National Guard's Army"
	NCC_the_loyal_army_desc:0 "The State's Army"
	NCC_legitimize_the_junta_dictatorship:0 "A Legitimized Dictatorship"
	NCC_legitimize_the_junta_dictatorship_desc:0 "We are legitimizing the dictatorship by establishing firm institutions, rallying public support, and presenting our rule as the only path to order and stability. Through control of media, law, and the military, we secure recognition of our authority as both lawful and necessary."
	NCC_our_natural_borders:0 "Our Natural Borders"
	NCC_our_natural_borders_desc:0 "We are securing Minnesota’s natural borders by expanding west toward the Missouri River line and pressing into Iowa and Wisconsin. This expansion strengthens our strategic position, ensures control over vital resources, and establishes our dominance in the heart of the Midwest."
	NCC_secure_the_missouri_river_line:0 "Secure The Missouri River Line"
	NCC_secure_the_missouri_river_line_desc:0 "Secure The Missouri River Line"

l_english:
  MSH_adalberto_tejeda_olivares:0 "Adalberto Tejeda Olivares"

  MSH_petroleos_mexicanos:0 "Petróleos Mexicanos"

  MSH_church_power_5:0 "Catholic State"
  MSH_church_power_5_desc:0 "The hated Constitution of 1917 has been undone. After decades of abuses against the dignity of the True Faith, we are finally establishing the Holy Church as the ultimate authority, moral and legal, in Mexico!"
  MSH_church_power_4:0 "Powerful Church"
  MSH_church_power_4_desc:0 "We have reduced the repression of the True Faith by restoring their ownership of seminaries and churches, but much work remains to be done."
  MSH_church_power_3:0 "Assertive Church"
  MSH_church_power_3_desc:0 "We have ended attempts to stamp out the Catholic Church in Mexico. By allowing the priests a little autonomy, they will respect our control of the state and refrain from seeking to destabilize us."
  MSH_church_power_2:0 "Weak Church"
  MSH_church_power_2_desc:0 "The Constitution of 1917 requires measures aimed against the influence of the Catholic Church in Mexico. The Cristeros rebelled in the 1920s because of attempts to enforce those laws, but the people may now be ready for a secular  state."
  MSH_church_power_1:0 "Atheist State"
  MSH_church_power_1_desc:0 "The Catholic Church in Mexico will become a thing of the past. The priests are counter-revolutionaries and peddlers of superstitious nonsense. We will press ever harder to turn Mexico into a bastion of rationalism and science!"
  MSH_economic_expansion_idea:0 "Economic Invigoration"
  MSH_volunteers_2nd_cristero_war:0 "Volunteers in Mexico"
  MSH_economic_boom:0 "Recent Economic Boom"
  MSH_economic_boom_desc:0 "Since the disolution of united Mexico as a state, the states of Coahulia and Sonora have, in comparison to their neighbors, become centers of trade and thus benefited greatly from trade with the bordering states to the north."
l_english:

smo.1.t:0 "Little Dixie revolts!"
smo.1.d:0 "Several counties have written articles of secession and joined a rival government in Columbia. The government claims that our state has no legitimacy and derives from a puppet government illegally set up by the Union during the Civil War. How do we respond?"
smo.1.a:0 "This is treason! Call in the National Guard!"
smo.1.b:0 "Wait them out."








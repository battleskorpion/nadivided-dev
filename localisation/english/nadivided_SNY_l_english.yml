  SNY.election.2.t:0 "Democrats Win New York"
  SNY.election.2.d:0 "After the 1936 New York elections, Democratic president Herbert H. Lehman was won the election race."
  SNY.election.2.a:0 "Congratulations!"

  SNY.election.3.t:0 "Republicans Win New York"
  SNY.election.3.d:0 "After the 1936 New York elections, Republican president William F. Bleakly was won the election race."
  SNY.election.3.a:0 "Congratulations!"

  SNY.election.4.t:0 "Disputed Election"
  SNY.election.4.d:0 "After the 1936 New York elections, the vote came so close that the election has been disputed, leading to riots in the country. Due to the, the military would have to step in to regain control"
  SNY.election.4.a:0 "Congratulations?"

  # News Events
  SNY.news.1.t:0 "New York Civil War"
  SNY.news.1.d:0 "After a disputed election where neither party secured a vote, the [SNY.GetRulingParty] coup'd the country which caused a civil war. \nDue to this, [NYC.GetName] has taken their chance and has declared independence."
  SNY.news.1.a:0 "Will this affect the stock market?"


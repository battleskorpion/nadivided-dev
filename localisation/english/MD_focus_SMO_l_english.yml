 SMO_rebuild_sls_armory: "Rebuild the St. Lousi Armory"
 SMO_rebuild_sls_armory_desc: "The St. Louis Arsenal is the primary supplier of weapons in Missouri. However, leaving federal troops took much of the stock. Rebuilding it would both supply the armed forces with weapons and create employment."
 SMO_farmer_assocs: "Support Farmer Associations"
 SMO_farmer_assocs_desc: "Local farming cooperatives have been a great success to protect farmers. Supporting this sort of thing would give the singular farmer a chance."
 SMO_fund_sls_car_company: "Fund St. Louis Car Company"
 SMO_fund_sls_car_company_desc: "The St. Louis Car Company is a domestic manurfacturer of trolleys and railcars. Having this industry would be good logistical support."
 SMO_fund_sls_aircraft: "Fund St. Louis Aircraft"
 SMO_fund_sls_aircraft_desc: "The St. Louis Aircraft Corporation is a branch of the St. Louis Car Company that does aviation. With the main company secure, getting into its subsidiaries is a no brainer."

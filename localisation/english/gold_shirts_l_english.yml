MCH_disloyal_haciendas_desc:0 "Some Haciendas have large estates that have other interest than that of the state. Taking away from federal spending and overall development of the country to their own benefit."
MCH_silver_mine_expansion:0 "Silver Mines"
MCH_warlord_economy:0 "Warlord Economy"
MCH_unfinished_revolution:0 "Unfinished Revolution"
MCH_unfinished_revolution_desc:0 "After the defeat in the Cristero War, the Gold Shirts retreated to the north to recover their strength and wait out their enemies. This has led to some discourse among the revolutionaries - who have vown to destroy the cristeros.\nThis national spirit can be gotten rid of via §RWar§! with the §YCristeros§!, or §YCristeros§! no longer exists."
MCH_paramilitary_dominance:0 "Paramilitary Dominance"
MCH_paramilitary_dominance_desc:0 "Chihuahua is dominated by the Revolutionary Mexican Action Party, a paramilitary group, much of the state budget and direction of the country is attributed to the behavior of this group." 
MCH_cristeros_backed_insurgents:0 "Cristero Backed Insurgents"
MCH_cristeros_backed_insurgents_desc:0 "The [MDC.getname]s have convinced some members of the past disbanded churchs in Chihuahua to act as spies. They occasionally disrupt the production of war materials or civilian goods."

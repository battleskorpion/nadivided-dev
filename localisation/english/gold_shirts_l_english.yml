####FOCUSES
	MCH_deal_with_the_insurgency:0 "Deal With the Insurgency"
	MCH_deal_with_the_insurgency_desc:0 "We are dealing with the insurgency in Chihuahua by unleashing the full force of the Gold Shirt revolutionary state, deploying militias to crush opposition and secure control over the countryside. Through ruthless discipline and uncompromising resolve, we are determined to stamp out rebellion and consolidate our revolutionary order."
	MCH_limited_land_reform:0 "Limited Land Reform"
	MCH_limited_land_reform_desc:0 "We are implementing limited land reform, redistributing portions of land to peasants to ease unrest while preserving the estates of key allies. This balances popular demands with the stability of our revolutionary state."
	MCH_deal_with_internal_political_strife:0 "Instill Political Discipline"
MCH_deal_with_internal_political_strife_desc:0 "We are dealing with internal strife by tightening control over dissent and reinforcing unity through discipline and loyalty to the state. By swiftly addressing divisions, we secure stability and maintain the strength of our movement."

	MCH_prepare_for_war:0 "Prepare For War"
MCH_prepare_for_war_desc:0 "Prepare For War"
	MCH_attack_sonora:0 "A Deal with the Communists"
	MCH_attack_sonora_desc:0 "Although our enemies, we are too weak to deal with both the [BAJ.getname] and the [MCD.getname] at the same time. Having a joint annexation of our weak neighbors will strengthen our position whilst also keeping the cristeros from becoming involved."
	MCH_attack_sinola:0 "A Deal with the Cristeros"
	MCH_attack_sinola_desc:0 "Dividing up land between us and the cristeros is the best way for us the gain land whilst not risking a full on intervention from the cristeros...yet."
	MCH_mexico_for_mexicans:0 "Mexico for Mexicans"
	MCH_mexico_for_mexicans_desc:0 "A Racially pure mexico is the best mexico, let no inner mixing of the blood taint mexico from now until perpetuity!"
	MCH_women_in_the_force:0 "Female Nursing Corps"
	MCH_women_in_the_force_desc:0 "Female Nursing Corps"
	MCH_secularize_education:0 "Secularize Education"
	MCH_secularize_education_desc:0 "Secularize Education"
	MCH_corporatist_cooperatives:0 "Corporatist Cooperatives"
	MCH_corporatist_cooperatives_desc:0 "We are establishing corporatist cooperatives, uniting workers, employers, and the state into tightly managed bodies that regulate production and resolve disputes. This system strengthens economic efficiency while ensuring loyalty to the revolutionary order."
	MCH_nationalize_industries:0 "Nationalize Industries"
	MCH_nationalize_industries_desc:0 "Nationalize Industries"
	MCH_embrace_autarky:0 "A Golden Autarky"
	MCH_embrace_autarky_desc:0 "Autarky"
	MCH_strike_at_the_communist:0 "Fate of the [BAJ.getname]"
	MCH_strike_at_the_communist_desc:0 "It time for the communist to feel the wraith of the goldshirts!"
	MCH_the_fate_of_the_cristeros:0 "Intervene in the 2nd Cristero War"
	MCH_the_fate_of_the_cristeros_desc:0 "We are intervening in the Second Cristero War, deploying our forces to suppress clerical reaction and defend the authority of the revolutionary state. By breaking the power of the Church’s militants, we secure our vision of a modern and loyal Mexico."
	MCH_give_it_our_all:0 "Give it our All"
	MCH_give_it_our_all_desc:0 "Give it our All"
	MCH_aztec_war_clubs:0 "Aztec War Clubs"
	MCH_aztec_war_clubs_desc:0 "We are reviving the symbolism of Aztec war clubs, adopting them as emblems of strength, tradition, and revolutionary resolve. These weapons, once wielded by warriors of the past, now serve as powerful icons uniting our people under a spirit of defiance and conquest."

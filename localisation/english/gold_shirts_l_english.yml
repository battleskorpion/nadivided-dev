####EVENTS
gold_shirts.21.t:0 "Cristeros Sabotage Arms Factory"
gold_shirts.21.d:0 "Insurgents have partially destory one of our factories, curse them!"
gold_shirts.21.a:0 "Okay then"
gold_shirts.22.t:0 "Cristeros Sabotage Civilian Factory"
gold_shirts.22.d:0 "Insurgents have partially destory one of our factories, curse them!"
gold_shirts.22.a:0 "Okay"
gold_shirts.23.t:0 "Cristeros Sabotage Infrastructure"
gold_shirts.23.d:0 "Insurgents have partially destory some of our infrastructure"
gold_shirts.23.a:0 "Okay"

gold_shirts.8.t:0 "[FROM.getname] demands our Annexation"
gold_shirts.8.d:0 "[From.getname] has demanded our annexation, what shall we do? If we deny them, they will likely attack us."
gold_shirts.8.a:0 "We Surrender"
gold_shirts.8.b:0 "Come and take it"
gold_shirts.9.t:0 "[From.getname] accepts annexation"
gold_shirts.9.d:0 "This will bolster our nations prowess!"
gold_shirts.9.a:0 "Hurrah"
gold_shirts.10.t:0 "[from.getname] rejects annexation"
gold_shirts.10.d:0 " "
gold_shirts.10.a:0 "They will learn to regret this!"

gold_shirts.1.t:0 "Joint annexation of Sonora"
gold_shirts.1.d:0 "The Gold Shirts, our sworn enemy, only second to the cristeros, has offered us a deal to jointly annex sonora. They must be doing this to avoid intervention by the cristeros. Shall we accept their deal and both stand to benefit-and likely betray them in the future. Or shall we deny them the oppourtunity entirely."
gold_shirts.1.a:0 "Partition Sonora"
gold_shirts.1.b:0 "We don't deal with fascist"
gold_shirts.2.t:0 "They Accepted!"
gold_shirts.2.d:0 " "
gold_shirts.2.a:0 "Send Sonora a letter notifying them of their position as it now stands-annexation or death."
gold_shirts.3.t:0 "[Baj.getname] and [MCH.getname] demand our annexation!"
gold_shirts.3.d:0 "An attack from both sides is an impossible threat to deal with, what shall we do?"
gold_shirts.3.a:0 "There is nothing we can do"
gold_shirts.3.b:0 "Never Surrender!"
gold_shirts.4.t:0 "[From.getname] refuses to work with us!"
gold_shirts.4.d:0 "[from.getname] has refused to benefit from annexing sonora, now we are the only ones who will attack sonora, however we must be wary of cristero interference."
gold_shirts.4.a:0 "More for the taking!"
gold_shirts.11.t:0 "The Partition of the North"
gold_shirts.11.d:0 "[From.getname] has offered a deal we cannot deny. The joint annexation of Sinola and Coahulia."
gold_shirts.11.a:0 "We shall accept"
gold_shirts.11.b:0 "Why would we work with the enemy?"
gold_shirts.12.t:0 "[From.getname] accepted"
gold_shirts.12.d:0 " "
gold_shirts.12.a:0 "Great!"
gold_shirts.13.t:0 "[From.getname] demands our annexation"
gold_shirts.13.d:0 "The Cristeros and Gold shirts have come together to divide up our territory, undermining our soveriegnty, now we are being asked to give up all of our land for potential peace"
gold_shirts.13.a:0 "We don't stand a chance"
gold_shirts.13.b:0 "Never Surrender!"
gold_shirts.14.t:0 "[From.getname] has refused to work with us!"
gold_shirts.14.d:0 "[From.getname] has refused to work with us regarding the partition of the north, let us hope their not mad when we took the land we literally offered for free."
gold_shirts.14.a:0 "All our for the taking"
gold_shirts.15.t:0 "[From.getname] demands our annexation"
gold_shirts.15.d:0 "The Cristeros and Gold shirts have come together to divide up our territory, undermining our soveriegnty, now we are being asked to give up all of our land for potential peace"
gold_shirts.15.a:0 "We don't stand a chance"
gold_shirts.15.b:0 "Never Surrender!"
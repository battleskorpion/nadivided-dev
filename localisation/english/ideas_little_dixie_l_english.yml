l_english:

  LMO_lil_dixie:0 "Dixie Heritage"
  LMO_lil_dixie_desc:0 "Little Dixie was always a distinct region of Missouri. Historically, the region was built off of slave plantations for cash crops such as hemp and tobacco. The region is staunchly conservative and dedicated to preserving white supremacy. Eventually, tensions boiled over and locals began arming themselves, taking up the ways of their Confederate Bushwacker elders. Our independence is tenuous at best and will only be held through blood."



	PQC_redistribute_the_churchs_wealth: "Redistribute the Churchs Wealth"
	PQC_redistribute_the_churchs_wealth_desc: "We are redistributing the Catholic Church’s wealth to the people, taking control of land, property, and resources previously held by the clergy. This ensures that the Church’s riches serve the needs of the working class and support social and economic equality."

	PQC_plan_vautrin: "Plan Vautrin"
	PQC_plan_vautrin_desc: "We are colonizing northern Quebec to stabilize the province’s economy by developing its natural resources and creating new settlements. Expanding industry, agriculture, and infrastructure in these regions provides jobs, stimulates growth, and strengthens Quebec’s economic self-sufficiency."

	PQC_expand_abitibi_gold_mine: "Expand Abitibi Gold Mine"
	PQC_expand_abitibi_gold_mine_desc: "We are expanding the Abitibi gold mines to increase production, create jobs, and boost Quebec’s economy. This development strengthens the province’s industrial base and attracts investment to the northern regions."

	PQC_suspend_obligations_for_debtors: "Suspend Obligations for Debtors"
	PQC_suspend_obligations_for_debtors_desc: "We are suspending obligations to debtors to stimulate the economy, relieving financial pressure on workers and small businesses. This measure encourages spending, investment, and economic activity, helping to revitalize Quebec’s economy."

	PQC_mechanization_of_the_army: "Mechanization of the Army"
	PQC_mechanization_of_the_army_desc: "We are mechanizing the army, introducing vehicles, armored units, and modern equipment to increase mobility, firepower, and overall effectiveness. This modernization strengthens our military capability and readiness for future conflicts."

	PQC_quebecois_nationalism: "Quebecois Nationalism"
	PQC_quebecois_nationalism_desc: "We are promoting Quebec nationalism to strengthen cultural identity, political unity, and pride among the province’s people. By emphasizing our language, traditions, and shared history, we aim to build a cohesive and self-determined society."

	PQC_advanced_rubber_refining_techniques: "Advanced Rubber Refining Techniques"
	PQC_advanced_rubber_refining_techniques_desc: "We are advancing rubber refining techniques to increase efficiency, improve product quality, and expand industrial applications. These innovations strengthen Quebec’s manufacturing sector and boost economic growth."

	PQC_dairy_industry_commission: "Dairy Industry Commission"
	PQC_dairy_industry_commission_desc: "We are establishing the Dairy Industry Commission of Quebec to regulate production, ensure fair prices, and support local farmers. This initiative strengthens the province’s agricultural sector and promotes economic stability in rural communities."

	PQC_support_the_strikers: "Support the Strikers"
	PQC_support_the_strikers_desc: "We are supporting the strikers of the 1936 Montreal textile workers’ strike, standing with laborers demanding fair wages and better working conditions. By backing their struggle, we strengthen workers’ rights and promote social and economic justice in Quebec."

	PQC_democratic_diplomacy: "Democratic Diplomacy"
	PQC_democratic_diplomacy_desc: " "

	PQC_the_padlock_law: "The Padlock Law"
	PQC_the_padlock_law_desc: "The Padlock Law, passed in Quebec in 1937, allowed the government to close and seal any building used for “communist propaganda” or activities deemed subversive. It was a tool to suppress political dissent and curb the influence of leftist movements in the province."

	PQC_deterrence: "Deterrence"
	PQC_deterrence_desc: " "

	PQC_ban_poltical_opposition: "Ban Poltical Opposition"
	PQC_ban_poltical_opposition_desc: "We are banning political opposition to protect the revolution and prevent counter-revolutionary forces from undermining the workers’ state. This measure ensures that all power remains in the hands of the people and their chosen representatives."


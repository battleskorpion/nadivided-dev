	PQC_bombardier_aircraft_manufacturing_startup:0 "Bombardier Air"
	PQC_bombardier_aircraft_manufacturing_startup_desc:0 "Bombardier mainly produces snowmobiles and trucks, however it is the only local manufacturer in Quebec that can quickly take charge of current aircraft plants. Former Canadian plants shall be nationalized and will be now intregrated to Bombardier"

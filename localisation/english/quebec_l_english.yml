	PQC_quebec_communist_party:0 "One State, One Party"
	PQC_quebec_communist_party_desc:0 "One State, One Party"
	PQC_educate_the_masses:0 "Educate the Masses"
	PQC_educate_the_masses_desc:0 "We are educating the masses in Quebec to free them from the chains of ignorance imposed by the bourgeoisie. By spreading literacy and political consciousness, we arm the working class with the knowledge needed to build a just and equal socialist society."
	PQC_united_by_communism:0 "United by Communism"
	PQC_united_by_communism_desc:0 "We are united by communism, bringing together both anglophone and francophone workers of Quebec under one cause. Class solidarity transcends language, forging a common struggle against exploitation and for a socialist future."
	PQC_strengthen_the_alliance_commie:0 "Diplomacy"
	PQC_strengthen_the_alliance_commie_desc:0 "We are working to unite Canada diplomatically, fostering cooperation among its provinces and peoples through dialogue and mutual respect. By strengthening political and social bonds, we aim to build a more cohesive and stable nation."
	PQC_unite_by_force_commie:0 "Force"
	PQC_unite_by_force_commie_desc:0 "We are uniting Canada by force, sweeping aside the divisions maintained by the ruling class. Through revolutionary struggle, we bring together workers and peasants from every province under the banner of communism, forging one people’s republic free from exploitation."
	PQC_equal_rights:0 "Equal Rights"
	PQC_equal_rights_desc:0 "We are fighting for equal rights, ensuring that every worker—regardless of language, origin, or class—shares the same freedoms and opportunities. True equality can only be achieved through collective struggle and the abolition of exploitation."
	PQC_integration_commie:0 "DSRC"
	PQC_integration_commie_desc:0 "DSRC"
	PQC_integration_force_commie:0 "DSRC"
	PQC_integration_force_commie_desc:0 "DSRC"
	PQC_eradicate_fascism:0 "Eradicate Fascism"
	PQC_eradicate_fascism_desc:0 "Eradicate Fascism"
	PQC_liberation_of_the_proliteriate:0 "Liberate the Proliteriate"
	PQC_liberation_of_the_proliteriate_desc:0 "Liberate the Proliteriate"
	PQC_further_electrification:0 "Further Electrification"
	PQC_further_electrification_desc:0 "We are expanding electricity production by building new hydroelectric dams, harnessing Quebec’s rivers to power our industries and communities. This effort brings energy self-sufficiency, strengthens economic growth, and improves the lives of the people."
	PQC_national_radio:0 "National Radio"
	PQC_national_radio_desc:0 "We are establishing a national radio network to connect communities across Quebec, spreading information, education, and revolutionary ideas. This platform unites the population and ensures that the voice of the people reaches every corner of the province."
	PQC_spread_communism:0 "Spread Internationalism"
	PQC_spread_communism_desc:0 "We are spreading internationalism to other countries, promoting solidarity among workers and oppressed peoples worldwide. By sharing our revolutionary ideals, we aim to build a global movement against exploitation and imperialism."
	PQC_international_conflicts:0 "Conflicts Abroad"
	PQC_international_conflicts_desc:0 "Conflicts Abroad"
	PQC_world_revolution:0 "World Revolution"
	PQC_world_revolution_desc:0 "World Revolution"
	PQC_quebec_stands_alone:0 "Alone We Stand"
	PQC_quebec_stands_alone_desc:0 "Alone We Stand"
	PQC_abuse_the_soil_rights:0 "Abuse The Soil Rights"
	PQC_abuse_the_soil_rights_desc:0 "Abuse The Soil Rights"
	PQC_complete_agrarian_reform:0 "Complete Agrarian Reform"
	PQC_complete_agrarian_reform_desc:0 "Complete Agrarian Reform"
	PQC_the_quiet_revolution:0 "The Quiet Revolution"
	PQC_the_quiet_revolution_desc:0 "The Quiet Revolution, beginning in the 1960s in Quebec, was a period of rapid social, political, and economic change. It saw the secularization of society, expansion of the welfare state, modernization of education, and the rise of Quebec nationalism, fundamentally transforming the province’s identity and governance."

###DECISION CAT
PQC_plan_vautrin_decision_cat:0 "Plan Vautrin"
PQC_plan_vautrin_decision_cat_desc:0 "Québec government colonization program launched during the Great Depression under Minister of Colonization Irénée Vautrin. Its purpose was to relieve urban unemployment by resettling families on farmland in underpopulated regions such as Abitibi, Saguenay–Lac-Saint-Jean, Bas-Saint-Laurent, and Gaspésie. The plan provided land, tools, and support for settlers, combining individual and collective colonization methods, with the Catholic Church playing a key role in organizing parishes and communities. While it stimulated regional growth—Abitibi’s population tripled in the 1930s—the program also faced challenges of isolation, inadequate infrastructure, and political criticism. It was ultimately phased out in 1937 and replaced by new colonization efforts under Maurice Duplessis."

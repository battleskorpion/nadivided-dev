	PQC_crack_down_on_jazz_clubs: "Crack Down on Jazz Clubs"
	PQC_crack_down_on_jazz_clubs_desc: "We are cracking down on Montreal’s jazz clubs, targeting them as centers of immorality and foreign influence. By closing these venues, we enforce social order, uphold traditional values, and assert control over the province’s cultural life."

	PQC_advantage_francophones: "Advantage Francophones"
	PQC_advantage_francophones_desc: "We are advantaging francophones in Quebec by prioritizing their language, culture, and opportunities in government, education, and employment. This policy strengthens their position in society and reinforces the province’s national identity."


	PQC_claim_new_england:0 "Claim New England"
	PQC_claim_new_england_desc:0 "We are claiming New England as the new “Lebensraum” for the Québécois people, seeking to secure land, resources, and opportunities for our community. This expansion strengthens our nation’s future and ensures the prosperity of our people."
	PQC_the_great_reportation:0 "The Great Reportation"
	PQC_the_great_reportation_desc:0 "We are organizing the repatriation of the Acadian people from Louisiana back to their ancestral homeland. This effort restores cultural ties, strengthens our population, and reinforces the unity of the Francophone community."
	PQC_the_jazz_golden_age:0 "Jazz Golden Age"
	PQC_the_jazz_golden_age_desc:0 "We are ushering in a new golden age of jazz after bringing the Acadian people back, blending their rich musical traditions with local culture. This revival strengthens cultural identity and celebrates the artistic contributions of our reunited Francophone community."
	PQC_status_quo:0 "Maintain Status Quo"
	PQC_status_quo_desc:0 "Maintain Status Quo"
	PQC_union_busting_tactics:0 "Union Busting Tactics"
	PQC_union_busting_tactics_desc:0 "Union Busting Tactics"
	PQC_supress_political_opposition:0 "Supress Political Opposition"
	PQC_supress_political_opposition_desc:0 "Supress Political Opposition"
	PQC_strengthen_catholic_church_role:0 "Strengthen the Church's Role in Society"
	PQC_strengthen_catholic_church_role_desc:0 "We are strengthening the Church’s role in society, ensuring it guides moral values, education, and community life. By empowering religious institutions, we reinforce social cohesion and uphold traditional cultural principles."
	PQC_business_liberalism:0 "Business Liberalism"
	PQC_business_liberalism_desc:0 "We are promoting business liberalism to encourage private enterprise, entrepreneurship, and economic growth. By reducing unnecessary restrictions and supporting commerce, we aim to create a dynamic economy that benefits both businesses and society."
	PQC_utilize_the_nationalist:0 "Utilize The Nationalist"
	PQC_utilize_the_nationalist_desc:0 "We are utilizing the nationalist movement to unify the population around shared cultural, linguistic, and political goals. This effort strengthens our identity, consolidates support, and advances the vision of a strong and self-determined Quebec."
	PQC_consolidate_le_chef_rule:0 "Consolidate Le Chef's Position"
	PQC_consolidate_le_chef_rule_desc:0 "We are consolidating Le Chef’s position by strengthening his authority, eliminating opposition, and ensuring loyalty throughout government and society. This solidifies his leadership and secures the direction of our movement."
	PQC_develop_cote_du_nord:0 "Develop Cote du Nord"
	PQC_develop_cote_du_nord_desc:0 "We are developing the Côte du Nord region to expand Quebec’s economy by exploiting natural resources, building infrastructure, and creating new industries. This development generates jobs, stimulates growth, and strengthens the province’s economic self-sufficiency."

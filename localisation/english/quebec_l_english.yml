	PQC_establish_farmer_cooperatives_desc: "We are promoting farmer co-ops in Quebec to help agricultural producers pool resources, share equipment, and collectively market their products. This strengthens rural communities, increases efficiency, and improves farmers’ economic security."

	PQC_the_forces_armees_quebecoises: "The Forces Armees Quebecoises"
	PQC_the_forces_armees_quebecoises_desc: "We are launching a recruitment drive to strengthen our workforce and military forces, encouraging citizens to join and contribute to the province’s economic and defense efforts. This initiative ensures sufficient manpower for both industry and national security."


	PQC_create_an_airforce_branch:0 "Force Aérienne Québécoise"
	PQC_create_an_airforce_branch_desc:0 "Historically Quebec served as a major training hub and potential airbase for destroying u boat in the hudson bay. Aside from that, Quebec as an independent province needs an airforce to survive in the tumultuous environment that now is North America"
	PQC_engine_improvements: "Engine Improvements"

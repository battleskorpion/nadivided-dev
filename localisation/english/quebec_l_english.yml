###EVENTS
quebec.1.t:0 "The Ontario Question"
quebec.1.d:0 "We have now conquered Ontario, our former overlords. Now we should deciede what to do with the anglophones within our province and our newly conquered land."
quebec.1.a:0 "Expel Them!"
quebec.1.b:0 "Integrate them"
quebec.2.t:0 "Elections!"
quebec.2.d:0 "With the upcoming strikes, Maurice Duplessis has called for elections to gain more seats in parlament, however despite his best efforts, he has actually lost the majority for the government. The Liberal Parti is now looking to regain its dominant position. Who shall lead the new government, Louis Taschereau - who resigned the past election due to fiscal discrepancies. Or Adelard Godbout - whom shall bring new blood the party."
quebec.2.a:0 "Louis Alexandre Taschereau"
quebec.2.b:0 "Adelard Godbout"
quebec.3.t:0 "The Shadow Scheme"
quebec.3.d:0 "In the event of war, the government of Quebec has passed the Shadow Scheme Act, allowing pre-allocation of factories that will be nationalized for the war effort"
quebec.3.a:0 "Overcome, We Shall"
quebec.4.t:0 "The Decision of Leadership!"
quebec.4.d:0 "During the strikes in Montreal City, it was clear that the strikes lacked decisive authority. This major flaw still carries over into the new government. To centralize authority would be in our best interest, so an election has been called. Shall we choose the natural choice - Fred Rose. Or shall we choose Lea Robeck a Revolutionary, no less a woman to lead us."
quebec.4.a:0 "Fred Rose"
quebec.4.b:0 "Lea Robeck"
quebec.5.t:0 "Coordinated Strikes!"
quebec.5.d:0 "The Texile Workers have finally been able to coordinate their advances with other union with new passing of the Padlock Law, we should be wary as strikes that go on like this could be regime changing..."
quebec.5.a:0 "Let them come"
quebec.6.t:0 "[Getyear] Textile Worker Strikes!"
quebec.6.d:0 "The Texiles Workers have risen up in the streets, the police have been called and martial law has been declared in Montreal, these next few weeks may get hasty."
quebec.6.a:0 "How shall we deal with this?"
quebec.7.t:0 "Position of the Strike"
quebec.7.d:0 "With the passing of the Padlock Law, and rumours of an upcoming strike, we must decide if we are to side with the capitalist, and crack down on the strike. Or shall we side with the Textile Workers, and not support the regime of Maurice Duplessis."
quebec.7.a:0 "Support the Workers"
quebec.7.b:0 "Crack down on the Strike"
quebec.8.t:0 "Choosing Our Flag"
quebec.8.d:0 "What flag shall we choose for the future?"
quebec.8.a:0 "The Sacred Heart"
quebec.8.b:0 "The Standard Maple Leaf, but Blue"
quebec.9.t:0 "Arcand leaves for Berlin"
quebec.9.d:0 "Adrien Arcand enters the room with a mixture of pride and awe. He has long admired Adolf Hitler from afar, and now, in Berlin, he meets the man he calls his political model. Hitler greets him with a measured politeness, his attention divided between the many foreign sympathizers who come to pay homage. Arcand presents himself as the “Canadian Führer,” explaining his plans to adapt National Socialist principles to Canada, to fight communism, and to curb Jewish influence in North America. He speaks earnestly, almost reverently, eager to show his loyalty. Hitler listens, offering encouragement but little concrete support, treating Arcand’s movement as one of many small satellites orbiting around the Reich. For Arcand, however, the meeting is momentous—an affirmation that his vision belongs to a greater international cause."
quebec.9.a:0 "No, Thank You Funny Mustasche Man"

	PQC_rearmament_scheme:0 "The Rearmament Scheme"
	PQC_rearmament_scheme_desc:0 "Quebec launches a Shadow Scheme, creating decentralized factories to protect production from potential attacks. These facilities ensure the province can maintain vital industrial output and strengthen its preparedness."
	PQC_the_canadian_furher:0 "The Canadian Furher"
	PQC_the_canadian_furher_desc:0 "Our glorious leader, Adrien Arcand, stands as the Canadian Führer, guiding our nation with unwavering vision and strength. Under his leadership, we embrace true nationalism, unity, and the principles that will secure Canada’s greatness and destiny."
	PQC_meet_with_funny_mustache_man:0 "A Visit to Funny Mustache Man"
	PQC_meet_with_funny_mustache_man_desc:0 "A Visit to Berlin"
	PQC_arrest_anti_fascists:0 "Arrest Anti-Fascist"
	PQC_arrest_anti_fascists_desc:0 "We are arresting anti-fascists who seek to undermine our movement and disrupt the unity of the nation. By removing these threats, we protect the vision and authority of our glorious leader and ensure the stability of our society."
	PQC_replace_jewish_schools_only:0 "Replace Jewish Schools"
	PQC_replace_jewish_schools_only_desc:0 "We are replacing Jewish schools in Quebec with state-run institutions to unify education under national values and promote loyalty to our movement. This ensures that all children are taught according to the principles of our vision for a strong and unified society."
	PQC_banish_minorities_to_hudson_bay:0 "Banish Jews to Hudson Bay"

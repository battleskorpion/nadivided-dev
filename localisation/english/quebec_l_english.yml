	PQC_a_decision_of_leadership: "A Decision of Leadership"
	PQC_a_decision_of_leadership_desc: "We are empowering one member of the workers’ council to provide stronger, more decisive leadership while remaining accountable to the collective. This ensures efficient decision-making without sacrificing the council’s democratic principles."


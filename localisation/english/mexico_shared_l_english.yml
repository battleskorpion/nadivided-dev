###FOCUSES
 MSH_modernize_industries:0 "Modernize Industries"
 MSH_modernize_industries_desc:0 "An era of change is coming. Investments are coming in, machines are being invented and our country must adapt in order to cope with those evolutions."
 MSH_infrastructure:0 "Improve State Infrastructure"
 MSH_infrastructure_desc:0 "A good infrastructure network helps connecting our nation as a unique coherent body."
 MSH_civilian_industries:0 "Expand Civilian Industries"
 MSH_civilian_industries_desc:0 "Our industry has to be modernized to keep up with the demands of our age."
 MSH_textile_mills:0 "Textile Mills"
 MSH_textile_mills_desc:0 "Having cheaper consumer goods such as clothes will help our nations civilian expansion."
 MSH_rural_schooling:0 "Rural Schooling"
 MSH_rural_schooling_desc:0 "Rural schools have needed extra fundning for while now, let us give them proper textbook and cirriculum. Who know what great minds could come out the rural communities to help our nation?"

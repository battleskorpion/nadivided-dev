l_english:
###IDEAS
  MSH_adalberto_tejeda_olivares:0 "Adalberto Tejeda Olivares"
  MSH_petroleos_mexicanos:0 "Petróleos Mexicanos"
  MSH_church_power_5:0 "Catholic State"
  MSH_church_power_5_desc:0 "The hated Constitution of 1917 has been undone. After decades of abuses against the dignity of the True Faith, we are finally establishing the Holy Church as the ultimate authority, moral and legal, in Mexico!"
  MSH_church_power_4:0 "Powerful Church"
  MSH_church_power_4_desc:0 "We have reduced the repression of the True Faith by restoring their ownership of seminaries and churches, but much work remains to be done."
  MSH_church_power_3:0 "Assertive Church"
  MSH_church_power_3_desc:0 "We have ended attempts to stamp out the Catholic Church in Mexico. By allowing the priests a little autonomy, they will respect our control of the state and refrain from seeking to destabilize us."
  MSH_church_power_2:0 "Weak Church"
  MSH_church_power_2_desc:0 "The Constitution of 1917 requires measures aimed against the influence of the Catholic Church in Mexico. The Cristeros rebelled in the 1920s because of attempts to enforce those laws, but the people may now be ready for a secular  state."
  MSH_church_power_1:0 "Atheist State"
  MSH_church_power_1_desc:0 "The Catholic Church in Mexico will become a thing of the past. The priests are counter-revolutionaries and peddlers of superstitious nonsense. We will press ever harder to turn Mexico into a bastion of rationalism and science!"
  MSH_economic_expansion_idea:0 "Economic Invigoration"
  MSH_volunteers_2nd_cristero_war:0 "Volunteers in Mexico"
  MSH_economic_boom:0 "Recent Economic Boom"
  MSH_economic_boom_desc:0 "Since the disolution of united Mexico as a state, the states of Coahulia and Sonora have, in comparison to their neighbors, become centers of trade and thus benefited greatly from trade with the bordering states to the north."
  MSH_nationalized_oil_fields:0 "Nationalized the Oil Fields"
  MSH_soldaderas:0 "Soldaderas"
  MSH_logistical_corp:0 "Logistical Corps"
  MSH_political_discourse:0 "Political Discourse"
  MSH_revolutionary_army:0 "Revolutionary Army"
  MSH_democratic_trade:0 "Democratic Trade"
  MSH_fight_for_freedom:0 "Fight For Freedom!"
###EVENTS
  mexico_shared.3.t:0 "Industrial Investments"
  mexico_shared.3.d:0 "There has been advancements in our industry thanks to our new government focus into our industry!"
  mexico_shared.3.a:0 "Thanks"
  mexico_shared.7.t:0 "Coordination with Automobile Manufacturies"
  mexico_shared.7.d:0 "Ford and Chrysler has come to our glorious nation offering to build an automobile factory in our nation. This would not only employ workers but help with military production."
  mexico_shared.7.a:0 "Ford"
  mexico_shared.7.b:0 "Chrysler"
  mexico_shared.7.b:0 "We shall make our own national car"
  mexico_shared.8.t:0 "Supply Lines"
  mexico_shared.8.d:0 "In the past Mexican armies have relied on other means than supply trucks and trains. Should we endorse a modern logistical chain to improve our army? Or stick with a more traditonal means?"
  mexico_shared.8.a:0 "Establish a Logistical Corps"
  mexico_shared.8.b:0 "Soldaderas"
  MSH_increase_conscription:0 "Active Conscription"
  MSH_caudillo_private_armies_idea:0 "Caudillo Private Armies"
  MSH_autonomous_general:0 "Autonomous General"
  MSH_autonomous_general_desc:0 "Cedillo, although a puppet of the Federalist government, has in practice been given complete juristiction of San Luis Potosi"
  MSH_illegitimate_government:0 "Illegitimate Government"
  MSH_illegitimate_government_desc:0 "Since the breakup of the Mexican Federalist government, Mexico has been broken up into mostly strongmen or caudillos. These government are not seen as entirely legitimate to the eyes of the people of Mexico"
  MSH_expanded_oil_trade:0 "Expanded Oil Trade"

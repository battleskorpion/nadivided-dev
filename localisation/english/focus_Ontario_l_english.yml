  PON_empower_the_unions:0 "Empower the Unions"
  PON_empower_the_unions_desc:0 "The wealth of Ontario is created by its workers, and they deserve a direct say in how it is managed. By expanding worker ownership, strengthening unions, and promoting democratic workplaces, economic power will be placed in the hands of those who produce it."
  PON_establish_the_proletarian_dictatorship:0 "Proletarian Dictatorship"
  PON_establish_the_proletarian_dictatorship_desc:0 "A proletarian dictatorship will be established to ensure that political and economic power rests with Ontario's working class rather than a privileged elite. Through workers' councils, democratic workplace governance, and public ownership of key industries, the state will safeguard the interests of labor while laying the foundation for a socialist society."
  PON_establish_the_union_of_quebec:0 "Establish the Union of Quebec"
  PON_establish_the_union_of_quebec_desc:0 "Following its incorporation into the Union's sphere of influence, Québec will be reorganized as a socialist republic aligned with the central government. Its institutions will be restructured under a workers' administration, coordinating economic planning, defense, and foreign policy with the Union while retaining limited authority over local governance and cultural affairs."
  PON_the_bureau_of_truth:0 "The Bureau of Truth"
  PON_the_bureau_of_truth_desc:0 "The Bureau of Truth is the Union's central authority for public information, responsible for ensuring the accuracy and consistency of official communications. It oversees state publications, broadcasts, educational materials, and historical records to promote ideological unity, counter misinformation, and maintain public confidence in the government."
  PON_egalitarism:0 "Egalitarianism"
  PON_egalitarism_desc:0 "Egalitarianism in Ontario seeks to create a society where all citizens have equal opportunities, rights, and access to resources regardless of social or economic background. Through policies promoting workers' rights, social welfare, and democratic participation, Ontario strives to reduce inequality and ensure that prosperity is shared among its people."
  PON_establish_new_economic_plan:0 "A New Economic Model"
  PON_establish_new_economic_plan:0 "Establishing a new economic plan is neccessary for Ontario, for industrialization and planned economics are the new way of things."
  PON_bomb_ottawa_and_blame_it_on_quebec:0 "Queen's Park Bombing"
  PON_bomb_ottawa_and_blame_it_on_quebec_desc:0 "A Sudden Explosive has gone off in the Ontario Legislative Building, who did this?"
  PON_martial_law:0 "Martial Law"
  PON_martial_law_desc:0 "Declare Martial Law"

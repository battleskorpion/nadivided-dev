  PON_Mackenzies_king_demise_desc:0 "We have hired a sniper to take out Mack the fat man."

  PON_break_tim_out_of_jail:0 "Break Tim Outta Jail"
  PON_break_tim_out_of_jail_desc:0 "He was imprisoned in Kingston Penitentiary in 1932, where he was the target of an apparent assassination attempt in his cell the night after a prison riot. While Buck was sitting in his cell listening to the mêlée outside, eight shots were fired into his cell via a window, narrowly missing the prisoner. He remains a prisoner there but not for much longer."


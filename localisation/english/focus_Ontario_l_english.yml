#####INDUSTRY
  PON_appoint_howe:0 "Appoint Howe"
  PON_appoint_howe_desc:0 "C.D. Howe is brought into government to oversee industry, using his business acumen to modernize production and streamline wartime planning."

  PON_imperial_oil_refineries:0 "Sarnia Refinery"
  PON_imperial_oil_refineries_desc:0 "Expand the Sarnia petrochemical complex to secure a steady fuel supply for industry and the military."

  PON_dollar_a_year_men:0 "A Dollar a Year Men"
  PON_dollar_a_year_men_desc:0 "Business leaders volunteer their expertise for a token salary, helping direct industry and logistics for the national war effort."

  PON_modernize_industry:0 "Industry Advancement"
  PON_modernize_industry_desc:0 "Investments in research and modern machinery boost factory efficiency and speed up production methods."

  PON_develop_ottowa:0 "Rebuild Ottawa"
  PON_develop_ottowa_desc:0 "Resources are committed to restoring Ottawa’s government district and infrastructure, symbolizing national recovery and unity."

  PON_hydroelectric_dams:0 "Hydroelectric Dams"
  PON_hydroelectric_dams_desc:0 "Construct new hydroelectric dams to provide cheap, reliable power for industry and national infrastructure."

  PON_aluminum_company_of_ontario:0 "Aluminum Company of Ontario"
  PON_aluminum_company_of_ontario_desc:0 "Developing domestic aluminum production to supply aircraft, vehicles, and industrial machinery for economic and military needs."

  PON_the_polymer_corporation:0 "Synthetic Research Development"
  PON_the_polymer_corporation_desc:0 "Synthetic Research Development"

  PON_hamilton_steel_plants:0 "Hamilton Steel Plants"
  PON_hamilton_steel_plants_desc:0 "Expanding the steel mills in Hamilton will increase output for construction, industry, and military production."

  PON_national_housing_act:0 "Increase Housing Developments"
  PON_national_housing_act_desc:0 "Increasing the current amount of housing will help combat the great depression."

  PON_arms_procurement_act:0 "Arms Procurement Act"
  PON_arms_procurement_act_desc:0 "Allowing the government to prioritize military production, will streamline contracts and secure weapons for the armed forces"

  PON_bits_and_pieces_program:0 "Bits and Pieces Program"
  PON_bits_and_pieces_program_desc:0 "With trade disrupted and foreign currency scarce, Ontario’s government has launched the ‘Bits and Pieces Program,’ a national salvage initiative to collect scrap metal, machine parts, and other reusable materials."

  PON_john_inglis_and_company:0 "John Inglis and Company"
  PON_john_inglis_and_company_desc:0 "Modernizeing John Inglis & Co. will boost domestic production of machinery, weapons, and industrial equipment for Ontario’s growing economy and defense needs."

  PON_war_fueled_economy:0 "Ontario Industrial Juggernaut"
  PON_war_fueled_economy_desc:0 "Ontario’s industrial sector surges forward, combining steel, aluminum, and manufacturing to become the economic and military backbone."

  PON_defense_research_grants:0 "Defense Research Grants"
  PON_defense_research_grants_desc:0 "The government funds advanced research programs to improve weapons, vehicles, and military technologies for Ontario’s armed forces."

  PON_national_steel_car:0 "National Steel Car"
  PON_national_steel_car_desc:0 "The government grants subsidies to Steel Car Ltd., boosting railcar and industrial steel production to support economic recovery and rearmament."

  PON_expand_university_of_toronto:0 "Expand University of Toronto"
  PON_expand_university_of_toronto_desc:0 "Investing in the University of Toronto to advance scientific research and train the engineers and technicians needed for industry and defense."

  PON_war_bonds:0 "Begin Rearmament"
  PON_war_bonds_desc:0 "Ontario launches a modest rearmament program, begining rearmament in this day and age is now necessary for our very survival"

  PON_wartime_prices_and_trade_board:0 "Wartime Prices and Trade Act"
  PON_wartime_prices_and_trade_board_desc:0 "“Imposes price controls and trade regulations to prevent profiteering, stabilize the economy, and keep essential goods affordable during the buildup to war."

  PON_unemployment_and_farm_relief_act:0 "Unemployment and Farm Relief Act"
  PON_unemployment_and_farm_relief_act_desc:0 "Providing aid to unemployed workers and struggling farmers, and thus stabilizing rural communities and easing the effects of the Great Depression."

  PON_develop_rural_ontario:0 "Develop Rural Ontario"
  PON_develop_rural_ontario_desc:0 "Developing the rural farms of ontario to include wheat and grain production will help stabilize the food shortage situtation."

  PON_secure_southern_imports:0 "Secure Southern Imports"
  PON_secure_southern_imports_desc:0 "Securing trade with the states south of us will be "

  PON_national_resources_mobilization_act:0 "National Resources Mobilization Act"
  PON_national_resources_mobilization_act_desc:0 "The government needs to be able to direct and control the labor and resources for proper war production in the upcoming forseen conflicts."

  PON_defence_of_ontario_regulations:0 "Anti-Subversive Activites"
  PON_defence_of_ontario_regulations_desc:0 "Increase Intelligence Capabilites"

  PON_national_loyalty_laws:0 "National Loyalty Laws"
  PON_national_loyalty_laws_desc:0 "National Loyalty Laws require members of the clergy and religious institutions to affirm their loyalty to the Canadian state and place national law above foreign ecclesiastical authority. The legislation seeks to limit the political influence of the clerical class and ensure that religious organizations operating in Canada remain subordinate to the sovereignty of the state."

  PON_volunteers_from_the_south:0 "Volunteers from the South"
  PON_volunteers_from_the_south_desc:0 "Volunteers from the American South arrive in Ontario to support the KKK-controlled government, bringing manpower and organizational experience to its growing movement. Their arrival strengthens the regime’s forces and deepens its ties with American white-supremacist organizations."

  PON_expel_the_french_from_barrie:0 "Expel The French from Barrie"
  PON_expel_the_french_from_barrie_desc:0 "We are proclaiming the expulsion of French Canadians from Barrie, declaring them incompatible with our nationalist vision for Ontario. The regime orders their removal and the seizure of their property, seeking to impose an ethnically defined order across the province."

  PON_take_non_gentile_assets:0 "Take Non-Gentile Assets"
  PON_take_non_gentile_assets_desc:0 "We are proclaiming the seizure of assets belonging to those the regime classifies as non-Gentile, declaring their property subject to state control. The confiscations strip targeted communities of their businesses, homes, and wealth, further enforcing the regime’s discriminatory racial order."

  PON_pronvincial_conscription:0 "Pronvincial Conscription"
  PON_pronvincial_conscription_desc:0 "The Ontario government introduces provincial conscription tied to KKK membership, prioritizing registered members for military service and state positions. The policy further merges the organization with the provincial military apparatus, creating a force built around ideological loyalty. Most members historically were located in the plains of Alberta and Saskatchewan."

  PON_one_public_school_system:0 "One Public School System"
  PON_one_public_school_system_desc:0 "The Ontario government establishes a single public school system under KKK control, replacing independent and religiously affiliated schools with centralized state education. The new system is designed to impose the regime’s nationalist ideology and ensure uniform instruction across the province."

  PON_enforce_the_occupation_of_the_quebecois:0 "Enforce The Occupation"
  PON_enforce_the_occupation_of_the_quebecois_desc:0 "The occupation authorities expand their methods of control across Quebec, increasing military patrols, checkpoints, and restrictions on movement. Greater surveillance and administrative control are imposed as resistance continues to grow."

  PON_the_second_great_upheaval:0 "The Second Great Upheaval"
  PON_the_second_great_upheaval_desc:0 "The First Great Upheaval removed all of the Acadians from Acadia-Nova Scotia. Let a second upheaval begin, these catholic quebecois have been a thorn in our side long enough."

  PON_attack_saskatchewan:0 "Attack Saskatchewan"
  PON_attack_saskatchewan_desc:0 ""

  PON_secure_the_borders:0 "Secure The Borders"
  PON_secure_the_borders_desc:0 ""

  PON_invite_our_southern_bretheren:0 "Invite Southeren Bretheren"
  PON_invite_our_southern_bretheren_desc:0 "We are inviting our “Southern brethren” into an alliance, seeking to unite sympathetic movements across the border under a common cause. This partnership strengthens political and organizational ties while expanding our influence beyond Ontario."

  PON_kkk:0 "The Klan"
  PON_kkk_desc:0 "The Klan"

  PON_call_up_southern_volunteer_brigades:0 "Imperial Volunteer Brigades"
  PON_call_up_southern_volunteer_brigades_desc:0 "Imperial Volunteer Brigades"

  PON_arthur_meighen:0 "Arthur Meighen"
  PON_arthur_meighen_desc:0 "The Orange Order of Ontario wins the provincial election, bringing its nationalist and Protestant political movement into government. Its victory marks a major shift in Ontario politics as the organization begins transforming the province around its ideology."

  PON_combine_with_conservatives:0 "Combine with Conservatives"
  PON_combine_with_conservatives_desc:0 "The Orange Order of Ontario forms an electoral alliance with the Conservatives, combining their political strength to secure victory at the provincial level. The coalition brings the Orange Order’s nationalist agenda into the Conservative political establishment and reshapes Ontario’s government around their shared priorities."

  PON_institute_a_new_constitution:0 "Institute a New Constitution"
  PON_institute_a_new_constitution_desc:0 "Institute a New Constitution"

  PON_tour_george_VI:0 "Tour George VI"
  PON_tour_george_VI_desc:0 "King George IV tours Ontario, receiving an elaborate welcome from the provincial government and loyalist organizations. His visit is presented as a reaffirmation of Ontario’s ties to the British Crown and the wider Empire."

  PON_national_service_and_emergency_preparedness_act:0 "National Service and Emergency Preparedness Act"
  PON_national_service_and_emergency_preparedness_act:0 "We are establishing the National Service and Emergency Preparedness Act, creating a framework for compulsory national service and emergency mobilization across Ontario. The act expands the state’s ability to organize manpower and resources during crises while strengthening preparedness and civil defense."

  PON_Recreate_RCMP:0 "Reestablish RCMP"
  PON_Recreate_RCMP_desc:0 "Reestablish The Royal Canadian Military Police"
  PON_Orange_Order_Cadets:0 "Orange Order Cadets"
  PON_Orange_Order_Cadets_desc:0 "The Orange Order establishes cadet units across Ontario to provide young members with organized training, discipline, and civic instruction. The program promotes loyalty to the Crown, Protestant traditions, and the ideals of the movement from an early age."

  PON_repeal_quebec_dual_founding_status:0 "Repeal Quebec Dual Founding Status"
  PON_repeal_quebec_dual_founding_status_desc:0 "Repeal Quebec Dual Founding Status"

  PON_british_technological_exchange:0 "British Technological Exchange"
  PON_british_technological_exchange_desc:0 "Cooperation with the British will help us greatly in industrial and areonautical matters."

  PON_comprimise_with_the_quebecois:0 "Comprimise with the Quebecois"
  PON_comprimise_with_the_quebecois_desc:0 "We are reaching a compromise with the Québécois, easing tensions through guarantees for their language, culture, and provincial institutions. The agreement seeks to preserve Ontario’s political authority while reducing resistance and maintaining national unity."

  PON_enact_war_powers:0 "Enact War Powers Act"
  PON_enact_war_powers_desc:0 "The time for action is now, this act will enable the regime to further subsidize military industrial industries and infrastructure for the future survival of our nation!"


  PON_national_loyalty_laws:0 "National Loyalty Laws"
  PON_national_loyalty_laws_desc:0 "National Loyalty Laws require members of the clergy and religious institutions to affirm their loyalty to the Canadian state and place national law above foreign ecclesiastical authority. The legislation seeks to limit the political influence of the clerical class and ensure that religious organizations operating in Canada remain subordinate to the sovereignty of the state."

  PON_volunteers_from_the_south:0 "Volunteers from the South"
  PON_volunteers_from_the_south_desc:0 "Volunteers from the American South arrive in Ontario to support the KKK-controlled government, bringing manpower and organizational experience to its growing movement. Their arrival strengthens the regime’s forces and deepens its ties with American white-supremacist organizations."

  PON_expel_the_french_from_barrie:0 "Expel The French from Barrie"
  PON_expel_the_french_from_barrie_desc:0 "We are proclaiming the expulsion of French Canadians from Barrie, declaring them incompatible with our nationalist vision for Ontario. The regime orders their removal and the seizure of their property, seeking to impose an ethnically defined order across the province."

  PON_take_non_gentile_assets:0 "Take Non-Gentile Assets"
  PON_take_non_gentile_assets_desc:0 "We are proclaiming the seizure of assets belonging to those the regime classifies as non-Gentile, declaring their property subject to state control. The confiscations strip targeted communities of their businesses, homes, and wealth, further enforcing the regime’s discriminatory racial order."

  PON_pronvincial_conscription:0 "Pronvincial Conscription"
  PON_pronvincial_conscription_desc:0 "The Ontario government introduces provincial conscription tied to KKK membership, prioritizing registered members for military service and state positions. The policy further merges the organization with the provincial military apparatus, creating a force built around ideological loyalty. Most members historically were located in the plains of Alberta and Saskatchewan."

  PON_one_public_school_system:0 "One Public School System"
  PON_one_public_school_system_desc:0 "The Ontario government establishes a single public school system under KKK control, replacing independent and religiously affiliated schools with centralized state education. The new system is designed to impose the regime’s nationalist ideology and ensure uniform instruction across the province."

  PON_enforce_the_occupation_of_the_quebecois:0 "Enforce The Occupation"
  PON_enforce_the_occupation_of_the_quebecois_desc:0 "The occupation authorities expand their methods of control across Quebec, increasing military patrols, checkpoints, and restrictions on movement. Greater surveillance and administrative control are imposed as resistance continues to grow."

  PON_the_second_great_upheaval:0 "The Second Great Upheaval"
  PON_the_second_great_upheaval_desc:0 "The First Great Upheaval removed all of the Acadians from Acadia-Nova Scotia. Let a second upheaval begin, these catholic quebecois have been a thorn in our side long enough."


  PON_national_resources_mobilization_act:0 "National Resources Mobilization Act"
  PON_national_resources_mobilization_act_desc:0 "The government needs to be able to direct and control the labor and resources for proper war production in the upcoming forseen conflicts."

  PON_defence_of_ontario_regulations:0 "Anti-Subversive Activites"

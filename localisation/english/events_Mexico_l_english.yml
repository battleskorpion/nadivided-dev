l_english:
 na_mex.1.t: "Land Owners Unhappy"
 na_mex.1.d: "The land owners, also known as the Haciendas, are unhappy with the current policies enacted by [MEX.GetLeader] and his land reform.\nDo we submit to these elite, or do we stand strong in [MEX.GetLeader]'s policies?"
 na_mex.1.a: "And what will they do?"
 na_mex.1.b: "Maybe they have a point."
 na_mex.2.t: "Looming Hacienda Uprising"
 na_mex.2.d: "The Haciendas have begun to take up arms against the federal government, and are calling for a return to the old ways of land ownership.\nWe must decide how to respond to this threat."
 na_mex.2.a: "We will crush this 'uprising'."
 na_mex.2.b: "Perhaps we will stand with the Haciendas."
 na_mex.3.t: "The Haciendas Have Taken Up Arms"
 na_mex.3.d: "The Haciendas have taken up arms against the federal government, and are calling for a return to the old ways of land ownership.\nThey will soon revolt and we must decide how to answer to this threat."
 na_mex.3.a: "We will soon be ready as well. Hang on."
 na_mex.3.b: "That's it, take up arms!"
 na_mex.4.t: "The Hacienda War"
 na_mex.4.d: "After the land reforms of [MEX.GetLeader], the rich capitalists of the Haciendas have revolted against the federal government, and now Mexico is in a all out civil war."
 na_mex.4.a: "To arms! §GPlay as the Federal Government"
 na_mex.4.b: "To arms! §GPlay as the Haciendas"
 na_mex_ref.1.t: "Snap Elections"
 na_mex_ref.1.d: "The Haciendas have been defeated, and we must go forth to decide the future of Mexico. The government has called for a snap election, either for political stablity or reform. The ballot is open, and the people will decide the future of Mexico."
 na_mex_ref.1.a: "PNR Victory"
 na_mex_ref.1.b: "PLC Victory"
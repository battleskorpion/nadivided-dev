Northwest.1.t:0 "Reformation of The Council?"
Northwest.1.d:0 "After the fall of the Canadian Dominion our state has been in Chaos with Towns practially ruling themselves, We need to do something."
Northwest.1.a:0 "Reform the Council under our control"
Northwest.1.b:0 "The Status Quo is fine who needs a Government"

Northwest.2.t:0 "Fate of the new Council"
Northwest.2.d:0 "With the restoration of the government underway it is time for us to decide how the council will function"
Northwest.2.a:0 "Keep the Council as it was with one leader"
Northwest.2.b:0 "Allow the Council direct rule"